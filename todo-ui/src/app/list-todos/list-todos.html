<table border="1">
  <caption>My todo's</caption>
  <thead>
  <tr>
    <th>Description</th>
    <th>Target Date</th>
    <th>Is Completed?</th>
  </tr>
  </thead>
  <tbody>
    @for (todo of todos; track todo.id) {
      <tr>
        <td>{{ todo.description }}</td>
        <td>{{ todo.targetDate | date|uppercase }}</td>
        <td>{{ todo.done }}</td>
      </tr>
    }
  <!--  <tr *ngFor="let todo of todos">-->
  <!--    <td>{{ todo.id }}</td>-->
  <!--    <td>{{ todo.description }}</td>-->
  <!--  </tr>-->
  </tbody>
</table>
