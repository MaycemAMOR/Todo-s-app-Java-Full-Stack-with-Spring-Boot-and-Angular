<h1>My Todo's</h1>

@if (message()) {
  <div class=" alert alert-warning">{{ message() }}</div>
}

<div class="container">
  <table class="table">
    <thead>
    <tr>
      <th>Description</th>
      <th>Target Date</th>
      <th>Is Completed?</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    </thead>
    <tbody>

      @for (todo of todos(); track todo.id) {
        <tr>
          <td>{{ todo.description }}</td>
          <td>{{ todo.targetDate | date|uppercase }}</td>
          <td>{{ todo.done }}</td>
          <td>
            <button (click)="updateTodo(todo.id)" class="btn btn-success">Update</button>
          </td>
          <td>
            <button (click)="deleteTodo(todo.id)" class="btn btn-warning">Delete</button>
          </td>
        </tr>
      }
    <!--  <tr *ngFor="let todo of todos">-->
    <!--    <td>{{ todo.id }}</td>-->
    <!--    <td>{{ todo.description }}</td>-->
    <!--  </tr>-->
    </tbody>
  </table>
  <div class="row">
    <button (click)="createTodo()" class="btn btn-success">Add</button>
  </div>
</div>
