<H1>Todo</H1>
<!--En créant un alias as item dans le @if (todo(); as item), -->
<!--vous extrayez l'objet TodoBean du Signal. -->
<!--Le two-way binding [(ngModel)] s'applique alors directement -->
<!--sur les propriétés de cet objet :-->

@if (todo(); as item) {
  <div class="container">
    <fieldset class="form-group">
      <label>Description</label>
      <input type="text"
             [(ngModel)]="item.description"
             class="form-control" name="description" required="required">
    </fieldset>
    <fieldset class="form-group">
      <label>Target Date</label>
      <input type="date"
             [ngModel]="item.targetDate | date:'yyyy-MM-dd' "
             (ngModelChange)="item.targetDate = $event"
             class="form-control" name="targetDate" required="required">
    </fieldset>

    <button class="btn btn-success" (click)="saveTodo()">Save</button>
  </div>
}
